name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Vosk English India model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3             -o /tmp/vosk-model.zip             https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q /tmp/vosk-model.zip -d app/src/main/assets

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: gradle assembleDebug --stacktrace -POPENROUTER_API_KEY="$OPENROUTER_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJNX-AI-v1.5-mio-vosk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
